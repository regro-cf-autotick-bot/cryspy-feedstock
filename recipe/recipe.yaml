context:
  name: cryspy
  version: "0.19.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/71/fb/6e3e5d07b5eff80fe04589d4c168b023d4a3aff12986d8b33b31f9b3eeae/cryspy-${{ version }}.tar.gz
  sha256: fea51a7e255438aa7e9c466bd16f59da90e7229ec87f94c49353239b484c4da8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - versioningit
  run:
    - python >=${{ python_min }}
    - numpy >=2.0
    - scipy >=1.13
    - pycifstar
    - matplotlib-base >=3.9

tests:
  - script: python -c "import cryspy"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: PNPD data analysis
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ikibalin/cryspy

extra:
  recipe-maintainers:
    - conda-forge/easyscience
    - MridulS

context:
  name: cryspy
  version: "0.19.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/ce/90/baeecaeb167cfc468c428cc9e9e0adad3265fe1e682314b13aed3b43c657/cryspy-${{ version }}.tar.gz
  sha256: 59cdc475e5b68b91be1b68b1462d62d431f0646d6f1920b11ced48ba31b42295

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - versioningit
  run:
    - python >=${{ python_min }}
    - numpy >=2.0
    - scipy >=1.13
    - pycifstar
    - matplotlib-base >=3.9

tests:
  - script: python -c "import cryspy"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: PNPD data analysis
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ikibalin/cryspy

extra:
  recipe-maintainers:
    - conda-forge/easyscience
    - MridulS

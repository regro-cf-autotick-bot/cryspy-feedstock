context:
  name: cryspy
  version: "0.20.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/b2/91/d19888872b843773b2cf4cee52854381523ca83fe5c6c207cb9e333f31ef/cryspy-${{ version }}.tar.gz
  sha256: 8d22dd9b0815a2ffe3c2fffebdcfd181bae8b5f8a979e740f0e42b645dac69d0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - versioningit
  run:
    - python >=${{ python_min }}
    - numpy >=2.0
    - scipy >=1.13
    - pycifstar
    - matplotlib-base >=3.9

tests:
  - script: python -c "import cryspy"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: PNPD data analysis
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ikibalin/cryspy

extra:
  recipe-maintainers:
    - conda-forge/easyscience
    - MridulS
